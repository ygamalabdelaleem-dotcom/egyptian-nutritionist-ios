<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>خبير التغذية المصري & أكلي | الشغل المكتبي وما بعد المرارة</title>

  <!-- iOS Web App / PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="خبير التغذية" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font Cairo & iOS Styles -->
  <link rel="stylesheet" href="./styles.css?v=11" />
</head>
<body class="min-h-screen flex flex-col justify-between">
  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-14 left-4 right-4 z-50 flex flex-col items-center gap-2 pointer-events-none max-w-md mx-auto"></div>

  <!-- iOS Sticky Header -->
  <header class="ios-header sticky top-0 z-40 px-4 pb-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-emerald-500 to-slate-900 flex items-center justify-center shadow-md border border-emerald-400/30 text-base">
          🥗
        </div>
        <div>
          <h1 class="text-xs font-extrabold text-white leading-tight">خبير التغذية المصري & أكلي 🇪🇬</h1>
          <p class="text-[9px] text-emerald-300 font-semibold">ساندوتشات • مشروبات • سوبر ماركت • بدون مرارة 🩺</p>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button
          onclick="switchTab('foods', 'مشروبات')"
          class="ios-btn bg-sky-500/20 hover:bg-sky-500/30 border border-sky-400/40 text-sky-300 text-[10px] font-bold px-2 py-1.5 rounded-xl flex items-center gap-1"
        >
          <span>🥤</span>
          <span>مشروبات</span>
        </button>
        <button
          onclick="switchTab('foods', 'سوبر ماركت')"
          class="ios-btn bg-purple-500/20 hover:bg-purple-500/30 border border-purple-400/40 text-purple-300 text-[10px] font-bold px-2 py-1.5 rounded-xl flex items-center gap-1"
        >
          <span>🛒</span>
          <span>سوبرماركت</span>
        </button>
        <button
          onclick="switchTab('foods', 'ساندوتشات')"
          class="ios-btn bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-amber-300 text-[10px] font-bold px-2 py-1.5 rounded-xl flex items-center gap-1"
        >
          <span>🥪</span>
          <span>ساندوتشات</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="app-main-content" class="flex-1 max-w-md w-full mx-auto px-4 pt-4 pb-24"></main>

  <!-- Floating Circular AI Nutritionist Button (Voice + Text Chat Bubble) -->
  <div id="floating-ai-widget" class="floating-ai-fab fixed z-40 flex flex-col items-center gap-2">
    <button
      id="floating-voice-btn"
      type="button"
      onclick="toggleAiVoiceRecording(true)"
      title="كلم الخبير بالصوت (فويس)"
      aria-label="كلم الخبير بالصوت"
      class="ios-btn w-11 h-11 rounded-full bg-slate-900/95 hover:bg-slate-800 text-emerald-300 border-2 border-emerald-400/60 shadow-xl flex items-center justify-center text-lg"
    >
      🎙️
    </button>
    <button
      id="floating-chat-btn"
      type="button"
      onclick="openAiChatBubble()"
      title="شات وفويس مع الخبير الغذائي"
      aria-label="شات وفويس مع الخبير الغذائي"
      class="ios-btn w-14 h-14 rounded-full bg-gradient-to-tr from-emerald-600 via-emerald-500 to-teal-400 text-slate-950 shadow-2xl pulse-emerald border-2 border-white/40 flex flex-col items-center justify-center relative"
    >
      <span class="text-xl leading-none">💬</span>
      <span class="text-[8px] font-extrabold text-slate-950 leading-none mt-0.5">فويس/شات</span>
      <span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-slate-950 text-emerald-300 border border-emerald-400 text-[10px] flex items-center justify-center shadow">
        🤖
      </span>
    </button>
  </div>

  <!-- iOS Bottom Tab Bar -->
  <nav class="ios-tab-bar fixed bottom-0 left-0 right-0 z-40 px-1.5 pt-2">
    <div class="max-w-md mx-auto grid grid-cols-6 gap-0.5 text-center">
      <button
        data-tab-btn="dashboard"
        onclick="switchTab('dashboard')"
        class="ios-btn flex flex-col items-center justify-center py-1 text-emerald-400"
      >
        <span class="text-base">📊</span>
        <span class="text-[9px] font-bold mt-0.5">يومي</span>
      </button>

      <button
        data-tab-btn="foods"
        onclick="switchTab('foods')"
        class="ios-btn flex flex-col items-center justify-center py-1 text-slate-400"
      >
        <span class="text-base">🥪</span>
        <span class="text-[9px] font-bold mt-0.5">سجل أكلك</span>
      </button>

      <button
        data-tab-btn="ai"
        onclick="switchTab('ai')"
        class="ios-btn flex flex-col items-center justify-center py-1 text-slate-400"
      >
        <div class="w-9 h-9 -mt-3.5 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg pulse-emerald border border-white/20">
          <span class="text-base">🤖</span>
        </div>
        <span class="text-[9px] font-extrabold text-emerald-300 mt-0.5">الخبير AI</span>
      </button>

      <button
        data-tab-btn="insights"
        onclick="switchTab('insights')"
        class="ios-btn flex flex-col items-center justify-center py-1 text-slate-400"
      >
        <span class="text-base">📈</span>
        <span class="text-[9px] font-bold mt-0.5">متابعتي</span>
      </button>

      <button
        data-tab-btn="supplements"
        onclick="switchTab('supplements')"
        class="ios-btn flex flex-col items-center justify-center py-1 text-slate-400"
      >
        <span class="text-base">💊</span>
        <span class="text-[9px] font-bold mt-0.5">مكملاتي</span>
      </button>

      <button
        data-tab-btn="profile"
        onclick="switchTab('profile')"
        class="ios-btn flex flex-col items-center justify-center py-1 text-slate-400"
      >
        <span class="text-base">⚙️</span>
        <span class="text-[9px] font-bold mt-0.5">إعداداتي</span>
      </button>
    </div>
  </nav>

  <!-- Data & Application Scripts -->
  <script src="./data/egyptian-foods.js?v=11"></script>
  <script src="./js/app.js?v=11"></script>
</body>
</html>
